<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FT245 WebUSB True GPIO Tester</title>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 40px auto; padding: 20px; background: #f4f4f4;}
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px;}
        button { padding: 10px; font-weight: bold; cursor: pointer; margin: 5px; }
        .btn-out { background: #6c757d; color: white; border: none; border-radius: 4px;}
        .btn-out.active { background: #28a745; }
        .indicator { display: inline-block; width: 20px; height: 20px; border-radius: 50%; background: #dc3545; vertical-align: middle; margin-left: 10px;}
        .indicator.active { background: #28a745; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Hardware Authorization</h2>
        <button id="connectBtn" style="width:100%; background:#007bff; color:white;">🔌 Connect via WebUSB</button>
        <p style="font-size:12px; color:#666;">Requires WinUSB driver installed via Zadig tool.</p>
    </div>

    <div id="controls" style="display:none;">
        <div class="card">
            <h3>Outputs (D0 - D5)</h3>
            <button id="b0" class="btn-out" onclick="togglePin(0)">D0: OFF</button>
            <button id="b1" class="btn-out" onclick="togglePin(1)">D1: OFF</button>
            <button id="b2" class="btn-out" onclick="togglePin(2)">D2: OFF</button>
            <button id="b3" class="btn-out" onclick="togglePin(3)">D3: OFF</button>
            <button id="b4" class="btn-out" onclick="togglePin(4)">D4: OFF</button>
            <button id="b5" class="btn-out" onclick="togglePin(5)">D5: OFF</button>
        </div>

        <div class="card">
            <h3>Inputs</h3>
            <p>D6 Pin State: <span id="ind6" class="indicator"></span></p>
            <p>D7 Pin State: <span id="ind7" class="indicator"></span></p>
        </div>
    </div>

    <script>
				let device;
				let currentOutputByte = 0x00;
				const DIRECTION_MASK = 0x3F; // Pins D0-D5 = Outputs (1), D6-D7 = Inputs (0)

				document.getElementById('connectBtn').addEventListener('click', async () => {
						try {
								device = await navigator.usb.requestDevice({ filters: [{ vendorId: 0x0403 }] });
								await device.open();
								await device.claimInterface(0);

								// 1. Force the FT245RL into Asynchronous Bit-Bang Mode
								await device.controlTransferOut({
										requestType: 'vendor',
										recipient: 'device',
										request: 0x0B, 
										value: (0x01 << 8) | DIRECTION_MASK, 
										index: 1 
								});

								// 2. Set the background clock frequency to drive the physical output latches
								await device.controlTransferOut({
										requestType: 'vendor',
										recipient: 'device',
										request: 0x03, // Set Baud Rate
										value: 0x4138, // Standard 9600 Baud mapping configuration
										index: 1
								});

								document.getElementById('controls').style.display = 'block';
								document.getElementById('connectBtn').style.display = 'none';

								startInputPolling();
								
						} catch (err) {
								alert("WebUSB connection failed: " + err);
						}
				});

				async function togglePin(bitIndex) {
						const btn = document.getElementById(`b${bitIndex}`);
						const mask = 1 << bitIndex;

						if ((currentOutputByte & mask) === 0) {
								currentOutputByte |= mask;
								btn.innerText = `D${bitIndex}: ON`;
								btn.classList.add('active');
						} else {
								currentOutputByte &= ~mask;
								btn.innerText = `D${bitIndex}: OFF`;
								btn.classList.remove('active');
						}

						if (device) {
								const dataBuffer = new Uint8Array([currentOutputByte]);
								
								// Fired down Endpoint 2 to output the raw bits directly onto D0-D5
								await device.transferOut(2, dataBuffer); 
						}
				}

				function startInputPolling() {
						const ind6 = document.getElementById('ind6');
						const ind7 = document.getElementById('ind7');

						setInterval(async () => {
								if (!device) return;

								// Request 0x0C continuously intercepts the physical voltage state of the pins
								let result = await device.controlTransferIn({
										requestType: 'vendor',
										recipient: 'device',
										request: 0x0C,
										value: 0,
										index: 1
								}, 1);

								let pinByte = result.data.getUint8(0);

								if ((pinByte & 0x40) >> 6 === 1) ind6.classList.add('active');
								else ind6.classList.remove('active');

								if ((pinByte & 0x80) >> 7 === 1) ind7.classList.add('active');
								else ind7.classList.remove('active');

						}, 80); 
				}

    </script>
</body>
</html>
